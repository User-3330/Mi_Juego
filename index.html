<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoot The Block | 1.2 </title>
    <link rel="icon" href="tu_logo.png" type="image/png">
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { 
            width: 100vw; height: auto; max-width: 800px; max-height: 400px;
            border: 3px solid #3584b9; background-color: #000; 
            image-rendering: pixelated; 
        }
        
        #menuInicio, #leaderboardUI {
            position: absolute; width: 340px; padding: 20px;
            background: rgba(10, 30, 10, 0.95); z-index: 1000; 
            display: flex; flex-direction: column; align-items: center; 
            border: 3px solid #2ecc71; border-radius: 15px; text-align: center;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .logo-animado { animation: flotar 3s ease-in-out infinite; filter: brightness(1.2); }

        .leaderboard-table {
            width: 100%; margin: 15px 0; border-collapse: collapse; font-size: 14px;
        }
        .leaderboard-table th { color: #f1c40f; border-bottom: 2px solid #2ecc71; padding: 5px; }
        .leaderboard-table td { padding: 5px; border-bottom: 1px solid rgba(46, 204, 113, 0.2); }

        input[type="text"] {
            padding: 10px; width: 80%; border-radius: 5px; border: 2px solid #2ecc71;
            background: #111; color: white; text-align: center; font-size: 16px; margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div id="menuInicio">
        <img src="tu_logo.png" alt="Logo" class="logo-animado" style="width: 120px; margin-bottom: 10px;">
        <p style="color: #f1c40f; margin: 0 0 10px 0; font-weight: bold;">v1.2 - Tablas de Clasificación</p>
        
        <h3 style="margin: 5px 0; color: #2ecc71;">🏆 TOP 5 GLOBAL 🏆</h3>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Jugador</th>
                    <th>Puntos</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="3" style="color: #aaa;">Cargando récords...</td></tr>
            </tbody>
        </table>

        <p style="font-size: 12px; color: #bbb; margin-bottom: 10px;">Controles: Flechas (Arriba y Abajo) | Espacio : Disparar</p>
        <button onclick="cerrarMenu()" style="padding: 12px 30px; background: #2ecc71; color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%;">¡A JUGAR!</button>
    </div>

    <div id="leaderboardUI" style="display:none;">
        <h2 style="color: #e74c3c; margin-top: 0;">¡FIN DEL JUEGO!</h2>
        <p id="finalScoreText" style="font-size: 20px; font-weight: bold; margin: 10px 0;"></p> 
        
        <div id="registroNombreContainer" style="display: none; width: 100%;">
            <p style="color: #f1c40f; margin: 5px 0;">¡Felicidades! Guarda tu mejor récord:</p>
            <input type="text" id="playerNameInput" maxlength="15" placeholder="Tu Nombre o Nick">
            <button id="btnGuardarOnline" style="padding: 10px 20px; background: #f1c40f; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; width: 85%;">Guardar Récord Online</button>
        </div>

        <button onclick="location.reload()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 85%;">Volver al Inicio</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        // Credenciales vinculadas de tu Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyAngtlCv0JWDz1yNqyAzqgK5xw945PDkmQ",
          authDomain: "shoot-the-box-d8f2b.firebaseapp.com",
          projectId: "shoot-the-box-d8f2b",
          storageBucket: "shoot-the-box-d8f2b.appspot.com",
          messagingSenderId: "647479187001",
          appId: "1:647479187001:web:6f4cc561a8b190664f1ad4",
          measurementId: "G-PBD5VMGL38"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 800;
        canvas.height = 400;

        // Variables de Juego
        let score = 0;
        let health = 100;
        let gameActive = false;
        let lastEnemy = 0;
        let miRecordAnterior = 0;

        // Configuración clásica de deslizamiento (v1.1)
        const player = {
            x: 50,
            y: 170,
            width: 80,
            height: 60,
            speed: 5
        };

        let enemies = [];
        let bullets = [];
        let particles = [];

        const keys = { ArrowUp: false, ArrowDown: false };

        const imgFondo = new Image(); imgFondo.src = "fondo.png";
        const imgPlayer = new Image(); imgPlayer.src = "pistola.png";
        const imgEnemy = new Image(); imgEnemy.src = "enemigo.png";

        // Cargar Tabla Global filtrando duplicados para que no se repitan los nombres
        async function cargarLeaderboard() {
            try {
                // Traemos los récords ordenados de mayor a menor
                const q = query(collection(db, "leaderboard"), orderBy("puntos", "desc"));
                const querySnapshot = await getDocs(q);
                const tbody = document.getElementById("leaderboardBody");
                tbody.innerHTML = "";
                
                let posicion = 1;
                const nombresRegistrados = new Set();
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const nombreLimpio = data.nombre.trim().toLowerCase();

                    // Si el nombre aún no está en el Top 5, lo añadimos
                    if (!nombresRegistrados.has(nombreLimpio) && posicion <= 5) {
                        nombresRegistrados.add(nombreLimpio);
                        
                        tbody.innerHTML += `
                            <tr>
                                <td style="color: #2ecc71; font-weight:bold;">#${posicion}</td>
                                <td>${data.nombre}</td>
                                <td style="color: #f1c40f; font-weight:bold;">${data.puntos}</td>
                            </tr>
                        `;
                        posicion++;
                    }
                });

                if(posicion === 1) {
                    tbody.innerHTML = `<tr><td colspan="3" style="color: #aaa;">¡Sé el primero en jugar!</td></tr>`;
                }
            } catch (error) {
                console.error("Error al cargar la tabla online: ", error);
            }
        }

        // Guardar récord online
        async function guardarRecordOnline() {
            const inputNombre = document.getElementById("playerNameInput");
            const nombre = inputNombre.value.trim() || "Anónimo";
            
            const btn = document.getElementById("btnGuardarOnline");
            btn.innerText = "Guardando...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "leaderboard"), {
                    nombre: nombre,
                    puntos: score,
                    fecha: new Date().toISOString()
                });
                alert("¡Récord guardado con éxito!");
                location.reload();
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al conectar.");
                btn.innerText = "Guardar Récord Online";
                btn.disabled = false;
            }
        }

        window.cerrarMenu = function() {
            document.getElementById("menuInicio").style.display = "none";
            gameActive = true;
        };

        // --- EVENTOS DE TECLADO CLÁSICOS ---
        window.addEventListener('keydown', function(e) {
            if (!gameActive) return;
            if (e.key === "ArrowUp") keys.ArrowUp = true;
            if (e.key === "ArrowDown") keys.ArrowDown = true;
            if (e.code === "Space") {
                e.preventDefault();
                disparar();
            }
        });

        window.addEventListener('keyup', function(e) {
            if (e.key === "ArrowUp") keys.ArrowUp = false;
            if (e.key === "ArrowDown") keys.ArrowDown = false;
        });

        function disparar() {
            bullets.push({
                x: player.x + player.width - 10,
                y: player.y + 22,
                vx: 12
            });
        }

        function crearExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, vida: 1, color });
            }
        }

        function update(time) {
            if (!gameActive) return;

            if (keys.ArrowUp && player.y > 0) player.y -= player.speed;
            if (keys.ArrowDown && player.y < canvas.height - player.height) player.y += player.speed;

            if (time - lastEnemy > 1500) {
                enemies.push({ 
                    x: canvas.width, 
                    y: Math.random() * (canvas.height - 50),
                    speed: 3 + Math.random() * 2,
                    size: 50
                });
                lastEnemy = time;
            }

            bullets.forEach((b, i) => {
                b.x += b.vx;
                if (b.x > canvas.width) bullets.splice(i, 1);
            });

            enemies.forEach((e, i) => {
                e.x -= e.speed;

                if (e.x + e.size < 0) {
                    health -= 15; 
                    crearExplosion(0, e.y + e.size/2, "#e74c3c");
                    enemies.splice(i, 1);
                    if (health <= 0) morir();
                    return;
                }

                if (e.x < player.x + player.width && e.x + e.size > player.x && e.y < player.y + player.height && e.y + e.size > player.y) {
                    health -= 20;
                    crearExplosion(e.x, e.y, "red");
                    enemies.splice(i, 1);
                    if (health <= 0) morir();
                }

                bullets.forEach((b, j) => {
                    if (b.x < e.x + e.size && b.x + 10 > e.x && b.y < e.y + e.size && b.y + 5 > e.y) {
                        crearExplosion(e.x + e.size/2, e.y + e.size/2, "#ff4400");
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                    }
                });
            });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vida -= 0.02;
                if (p.vida <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (imgFondo.complete) ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);

            if (imgPlayer.complete) ctx.drawImage(imgPlayer, player.x, player.y, player.width, player.height);

            ctx.fillStyle = "yellow";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, 10, 5));
            
            enemies.forEach(e => { if (imgEnemy.complete) ctx.drawImage(imgEnemy, e.x, e.y, e.size, e.size); });
            
            particles.forEach(p => { 
                ctx.globalAlpha = p.vida; ctx.fillStyle = p.color; 
                ctx.fillRect(p.x, p.y, 4, 4); 
            });
            ctx.globalAlpha = 1;

            ctx.fillStyle = "white"; ctx.font = "bold 20px Arial";
            ctx.fillText("Puntos: " + score, 20, 35);

            ctx.fillStyle = "#333";
            ctx.fillRect(canvas.width - 220, 20, 200, 18);
            ctx.fillStyle = health > 35 ? "#2ecc71" : "#e74c3c";
            ctx.fillRect(canvas.width - 220, 20, (Math.max(0, health) / 100) * 200, 18);
            ctx.strokeStyle = "white"; ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width - 220, 20, 200, 18);
        }

        function morir() { 
            gameActive = false; 
            document.getElementById("leaderboardUI").style.display = "flex";
            document.getElementById("finalScoreText").innerText = "PUNTAJE FINAL: " + score;
            
            if (score > 0) {
                document.getElementById("registroNombreContainer").style.display = "block";
                document.getElementById("btnGuardarOnline").onclick = guardarRecordOnline;
            }
        }

        function drawLoop(time) { update(time); draw(); requestAnimationFrame(drawLoop); }
        
        cargarLeaderboard();
        requestAnimationFrame(drawLoop);
    </script>
</body>
</html>
