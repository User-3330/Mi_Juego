<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoot The Block - v1.1 Skin Update</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { border: 3px solid #3584b9; background-color: #000; box-shadow: 0 0 20px rgba(38, 99, 141, 0.5); }
        #ui { margin-bottom: 10px; font-size: 24px; font-weight: bold; }
        #restartBtn { margin-top: 15px; padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #e74c3c; color: white; border: none; border-radius: 5px; display: none; }
        
        /* Estilo del Menú */
        #menuInicio {
            position: absolute; width: 800px; height: 400px; 
            background: rgba(10, 30, 10, 0.95); z-index: 1000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border: 3px solid #2ecc71; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            color: white; font-family: 'Arial Black', sans-serif; text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

    <div id="menuInicio">
        <h1 style="font-size: 45px; margin-bottom: 5px;">Shoot The Block</h1>
        <p style="color: #f1c40f; margin-bottom: 25px;">VERSIÓN 1.1 - SKIN PACK</p>
        
        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <div onclick="cambiarSkin('pistola.png')" style="cursor: pointer; border: 2px solid white; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.1);">
                <img src="pistola.png" width="60" alt="Estándar">
                <p style="font-size: 12px; text-align: center;">BÁSICA</p>
            </div>
            <div onclick="alert('Skin Oro: ¡Próximamente en v1.2!')" style="cursor: pointer; border: 2px solid #555; padding: 10px; border-radius: 10px; opacity: 0.5;">
                <img src="pistola.png" width="60" style="filter: grayscale(100%)  brightness(1.5);">
                <p style="font-size: 12px; text-align: center;">ORO</p>
            </div>
        </div>

        <button onclick="cerrarMenu()" style="padding: 15px 40px; font-size: 20px; cursor: pointer; background: #2ecc71; color: white; border: none; border-radius: 50px; font-weight: bold; box-shadow: 0 4px #1a7d43;">¡A JUGAR!</button>
    </div>

    <div id="ui">PUNTOS: <span id="score">0</span></div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="leaderboardUI" style="display:none; margin-top: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 2px solid #3584b9; position: absolute; bottom: 20px;">
        <h3 style="margin: 0 0 10px 0;">¡FIN DEL JUEGO!</h3>
        <input type="text" id="playerName" placeholder="Tu Nombre" maxlength="10" style="padding: 8px; border-radius: 5px; border: none;">
        <button onclick="enviarPuntaje()" style="padding: 8px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer;">Subir Puntos</button>
        <button onclick="location.reload()" style="padding: 8px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">Reiniciar</button>
        <div id="top10" style="margin-top: 10px; text-align: left; font-size: 12px; font-family: monospace;"></div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        canvas.width = 800;
        canvas.height = 400;

        // --- VARIABLES DEL JUEGO ---
        let score = 0;
        let health = 100;
        let gameActive = false; // Empieza en falso para el menú
        let fondoX = 0; // para que el juego reconosca el fondo
        let enemies = [];
        let bullets = [];
        let particles = [];
        let shakeTime = 0;
        let shakeIntensity = 0;

        const player = { x: 50, y: 170, width: 80, height: 60, speed: 5 };

        // --- IMÁGENES ---
        const imgFondo = new Image(); imgFondo.src = "fondo.png";
        const imgPlayer = new Image(); imgPlayer.src = "pistola.png";
        const imgEnemy = new Image(); imgEnemy.src = "enemigo.png";

        // --- CONTROLES ---
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        function crearExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 4 + 1,
                    vida: 1.0,
                    color: color
                });
            }
        }

        function update(time) {
            if (!gameActive) return;

            // Dentro de la función update:
if (gameActive) {
    fondoX -= 2; // Velocidad del movimiento
    if (fondoX <= -canvas.width) {
        fondoX = 0; // Reinicia la posición
    }
}

            fondoX -= 1; // Ajusta el número para que vaya más rápido o lento
if (fondoX <= -canvas.width) {
    fondoX = 0; // Reinicia la posición para que no se acabe nunca
}

            fondoX -= 0.5; // Velocidad del fondo
if (fondoX <= -canvas.width) fondoX = 0;

            // Movimiento y Disparo
            if (keys["ArrowUp"] && player.y > 0) player.y -= player.speed;
            if (keys["ArrowDown"] && player.y < canvas.height - player.height) player.y += player.speed;
            if (keys["Space"] && time - (player.lastShot || 0) > 250) {
                bullets.push({ x: player.x + player.width - 10, y: player.y + 22 });
                player.lastShot = time;
            }

            // Generar Enemigos
            if (time - (window.lastEnemy || 0) > 1200) {
                enemies.push({ x: canvas.width, y: Math.random() * (canvas.height - 50), size: 50, speed: 4.5 });
                window.lastEnemy = time;
            }

            // Balas
            bullets.forEach((b, i) => {
                b.x += 12;
                if (b.x > canvas.width) bullets.splice(i, 1);
            });

            // Enemigos y Colisiones
            enemies.forEach((e, i) => {
                e.x -= e.speed;
                
                // Colisión con Jugador
                if (e.x < player.x + player.width && e.x + e.size > player.x && e.y < player.y + player.height && e.y + e.size > player.y) {
                    health -= 20;
                    crearExplosion(e.x, e.y, "#e74c3c");
                    enemies.splice(i, 1);
                    shakeTime = 10; shakeIntensity = 10;
                    if (health <= 0) morir();
                }

                // Colisión con Bala
                bullets.forEach((b, j) => {
                    if (b.x < e.x + e.size && b.x + 10 > e.x && b.y < e.y + e.size && b.y + 5 > e.y) {
                        crearExplosion(e.x + e.size/2, e.y + e.size/2, "#ff4400");
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        scoreEl.innerText = score;
                    }
                });

                if (e.x + e.size < 0) enemies.splice(i, 1);
            });
        }

        function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();

    // Efecto de sacudida (Shake)
    if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
        shakeTime--;
    }

    // --- SISTEMA DE FONDO INTELIGENTE (v1.1) ---
    if (imgFondo.complete && imgFondo.naturalWidth !== 0) {
        // Si la imagen funciona, la dibuja en movimiento
        ctx.drawImage(imgFondo, fondoX, 0, canvas.width, canvas.height);
        ctx.drawImage(imgFondo, fondoX + canvas.width, 0, canvas.width, canvas.height);
    } else {
        // FONDO NEÓN DE RESPALDO (Si la imagen sigue rota en F12)
        ctx.fillStyle = "#0a1e0a"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "#1a3a1a";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = (fondoX % 30); x < canvas.width; x += 30) {
            ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        for (let y = 0; y < canvas.height; y += 30) {
            ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
    }

    // --- DIBUJAR JUGADOR ---
    if (imgPlayer.complete) {
        ctx.drawImage(imgPlayer, player.x, player.y, player.width, player.height);
    }

    // --- DIBUJAR BALAS ---
    ctx.fillStyle = "#ffcc00";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, 10, 5));

    // --- DIBUJAR ENEMIGOS ---
    enemies.forEach(e => {
        if (imgEnemy.complete) {
            ctx.drawImage(imgEnemy, e.x, e.y, e.size, e.size);
        }
    });

   // --- DIBUJAR Y MOVER PARTÍCULAS ---
particles.forEach((p, i) => {
    // Estas 2 líneas son las que faltaban (le dan velocidad):
    p.x += p.vx; 
    p.y += p.vy;
    
    // Hacemos que desaparezcan poco a poco
    p.vida -= 0.02; 

    // Si la partícula ya es invisible, la eliminamos para no saturar el PC
    if (p.vida <= 0) {
        particles.splice(i, 1);
        return;
    }

    ctx.save();
    ctx.globalAlpha = p.vida;
    ctx.fillStyle = p.color;
    // Dibujamos el rastro de la explosión
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.restore();
});

    // --- BARRA DE VIDA ---
    ctx.fillStyle = "#333";
    ctx.fillRect(20, 20, 200, 15);
    ctx.fillStyle = health > 30 ? "#2ecc71" : "#e74c3c";
    ctx.fillRect(20, 20, (health / 100) * 200, 15);

    ctx.restore();
}

        function drawLoop(time) {
            update(time);
            draw();
            requestAnimationFrame(drawLoop);
        }

        function cerrarMenu() {
            document.getElementById("menuInicio").style.display = "none";
            gameActive = true;
        }

        function cambiarSkin(ruta) {
            imgPlayer.src = ruta;
        }

        function morir() {
            gameActive = false;
            document.getElementById("leaderboardUI").style.display = "block";
            cargarTabla();
        }

        function crearExplosion(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 12, // Explosión hacia los lados
            vy: (Math.random() - 0.5) * 12, // Explosión hacia arriba/abajo
            size: Math.random() * 5 + 2,
            vida: 1.0,
            color: color
        });
    }
}

        // --- LEADERBOARD (DREAMLO) ---
        const PRIVADA = "L7xIdx55hkqqJ3h0WlDKdA6o1QHcONskmuDi_izQ8eWg"; 
        const PUBLICA = "697552658f40bb1184c29e98";

        async function enviarPuntaje() {
            const nombre = document.getElementById("playerName").value || "Anónimo";
            await fetch(`https://www.dreamlo.com/lb/${PRIVADA}/add/${nombre}/${score}`);
            document.getElementById("playerName").disabled = true;
            cargarTabla();
        }

        async function cargarTabla() {
            const res = await fetch(`https://www.dreamlo.com/lb/${PUBLICA}/json`);
            const data = await res.json();
            let html = "<b>TOP 10 GLOBAL:</b><br>";
            if (data.dreamlo.leaderboard.entry) {
                let lista = Array.isArray(data.dreamlo.leaderboard.entry) ? data.dreamlo.leaderboard.entry : [data.dreamlo.leaderboard.entry];
                lista.slice(0, 10).forEach((entry, i) => html += `${i+1}. ${entry.name}: ${entry.score}<br>`);
            }
            document.getElementById("top10").innerHTML = html;
        }

        requestAnimationFrame(drawLoop);
    </script>
</body>
</html>
