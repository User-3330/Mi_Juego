<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoot The Block - Pro Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 3px solid #3584b9;
            background-color: #000;
            box-shadow: 0 0 20px rgba(38, 99, 141, 0.5);
        }
        #ui {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        #restartBtn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui">PUNTOS: <span id="score">0</span></div>
    <div id="leaderboardUI" style="display:none; margin-top: 20px; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; border: 2px solid #3584b9;">
    <h3>¡NUEVO RÉCORD!</h3>
    <input type="text" id="playerName" placeholder="Tu Nombre" maxlength="10" style="padding: 10px; border-radius: 5px; border: none;">
    <button onclick="enviarPuntaje()" style="padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer;">Subir Puntos</button>
    <div id="top10" style="margin-top: 15px; text-align: left; font-family: monospace;"></div>
</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restartBtn" onclick="location.reload()">Reiniciar Juego</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const restartBtn = document.getElementById("restartBtn");

        canvas.width = 800;
        canvas.height = 400;

        // --- VARIABLES DEL JUEGO ---
        let score = 0;
        let health = 100;
        let gameActive = true;
        let enemies = [];
        let bullets = [];
        let particles = [];
        
        let shakeTime = 0;
        let shakeIntensity = 0;

        const player = {
            x: 50,
            y: 170,
            width: 80,
            height: 60,
            speed: 5
        };

        // --- CONFIGURACIÓN MÓVIL ---
        let isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        let touchY = player.y; 

        // --- CARGA DE IMÁGENES ---
        const imgFondo = new Image();
        imgFondo.src = "fondo.png";

        const imgPlayer = new Image();
        imgPlayer.src = "pistola.png";

        const imgEnemy = new Image();
        imgEnemy.src = "enemigo.png"; 

        // --- CONTROLES ---
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        canvas.addEventListener("touchstart", (e) => {
            if (!gameActive) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchY = (touch.clientY - rect.top) * (canvas.height / rect.height) - player.height / 2;
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault(); 
            if (!gameActive) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchY = (touch.clientY - rect.top) * (canvas.height / rect.height) - player.height / 2;
        }, { passive: false });

        function crearExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 4 + 2,
                    vida: 1.0,
                    color: color
                });
            }
        }

        // --- ACTUALIZACIÓN ---
        let lastEnemyTime = 0;
        let lastShot = 0;

        function update(time) {
            if (!gameActive) return;

            if (isMobile) {
                let diff = touchY - player.y;
                player.y += diff * 0.2; 
                if (time - lastShot > 300) {
                    bullets.push({ x: player.x + player.width - 10, y: player.y + 22 });
                    lastShot = time;
                }
            } else {
                if (keys["ArrowUp"] && player.y > 0) player.y -= player.speed;
                if (keys["ArrowDown"] && player.y < canvas.height - player.height) player.y += player.speed;
                if (keys["Space"] && time - lastShot > 250) {
                    bullets.push({ x: player.x + player.width - 10, y: player.y + 22 });
                    lastShot = time;
                }
            }

            if (time - lastEnemyTime > 1200) {
                enemies.push({
                    x: canvas.width,
                    y: Math.random() * (canvas.height - 50),
                    size: 50,
                    speed: 4.5
                });
                lastEnemyTime = time;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += 12;
                if (bullets[i].x > canvas.width) bullets.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x -= e.speed;
                
                if (e.x < player.x + player.width && e.x + e.size > player.x && e.y < player.y + player.height && e.y + e.size > player.y) {
                    health -= 20;
                    crearExplosion(e.x, e.y, "#e74c3c");
                    enemies.splice(i, 1);
                    shakeTime = 10;
                    shakeIntensity = 10;
                    if (health <= 0) {
                        gameActive = false;
restartBtn.style.display = "block";
document.getElementById("leaderboardUI").style.display = "block"; // Muestra la tabla
cargarTabla(); // Carga los puntajes actuales
                        restartBtn.style.display = "block";
                    }
                    continue;
                }
                
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x < e.x + e.size && b.x + 10 > e.x && b.y < e.y + e.size && b.y + 5 > e.y) {
                        crearExplosion(e.x + e.size/2, e.y + e.size/2, "#e74c3c");
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        scoreEl.innerText = score;
                        shakeTime = 8;
                        shakeIntensity = 7;
                        break;
                    }
                }

                if (e.x + e.size < 0) enemies.splice(i, 1);
            }
        }

        // --- DIBUJO ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            if (shakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
                shakeTime--;
            }

            try {
                if (imgFondo.complete && imgFondo.naturalWidth !== 0) {
                    ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = "#1a1a1a";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            } catch (e) {}

            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.setLineDash([5, 15]);
            ctx.beginPath();
            ctx.moveTo(player.x + player.width - 10, player.y + 25);
            ctx.lineTo(canvas.width, player.y + 25);
            ctx.stroke();
            ctx.setLineDash([]);

            try {
                if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) {
                    ctx.drawImage(imgPlayer, player.x, player.y, player.width, player.height);
                } else {
                    ctx.fillStyle = "blue";
                    ctx.fillRect(player.x, player.y, player.width, player.height);
                }
            } catch (e) {}

            ctx.fillStyle = "#ffcc00";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, 10, 5));

            enemies.forEach(e => {
                try {
                    if (imgEnemy.complete && imgEnemy.naturalWidth !== 0) {
                        ctx.drawImage(imgEnemy, e.x, e.y, e.size, e.size);
                    } else {
                        ctx.fillStyle = "red";
                        ctx.fillRect(e.x, e.y, e.size, e.size);
                    }
                } catch (err) {
                    ctx.fillStyle = "red";
                    ctx.fillRect(e.x, e.y, e.size, e.size);
                }
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vida -= 0.02;
                if (p.vida <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.vida;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = "#333";
            ctx.fillRect(20, 20, 200, 15);
            ctx.fillStyle = health > 30 ? "#2ecc71" : "#e74c3c";
            ctx.fillRect(20, 20, (health / 100) * 200, 15);

            if (!gameActive) {
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("FIN DEL JUEGO", canvas.width / 2, canvas.height / 2);
            }

            ctx.restore();
        }

        function drawLoop(time) {
            update(time);
            draw();
            requestAnimationFrame(drawLoop);
        }

        requestAnimationFrame(drawLoop);
        const PRIVADA = "L7xIdx55hkqqJ3h0WlDKdA6o1QHcONskmuDi_izQ8eWg"; 
const PUBLICA = "697552658f40bb1184c29e98";

async function enviarPuntaje() {
    const nombre = document.getElementById("playerName").value || "Anónimo";
    const url = `https://www.dreamlo.com/lb/${PRIVADA}/add/${nombre}/${score}`;
    
    try {
        await fetch(url); // Envía los puntos a la nube
        document.getElementById("playerName").disabled = true;
        cargarTabla(); // Refresca la lista
    } catch (e) {
        console.error("Error al subir puntos", e);
    }
}

async function cargarTabla() {
    const url = `https://www.dreamlo.com/lb/${PUBLICA}/json`;
    const res = await fetch(url);
    const data = await res.json();
    
    let html = "<b>TOP 10 GLOBAL:</b><br>";
    if (data.dreamlo.leaderboard.entry) {
        // Si hay solo un puntaje, dreamlo no manda lista, así que lo convertimos
        let lista = data.dreamlo.leaderboard.entry;
        if (!Array.isArray(lista)) lista = [lista];
        
        lista.slice(0, 10).forEach((entry, i) => {
            html += `${i+1}. ${entry.name}: ${entry.score}<br>`;
        });
    }
    document.getElementById("top10").innerHTML = html;
}
    </script>
</body>

</html>
